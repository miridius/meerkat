# pnpm installs dependencies for both JS roots (this one — the
# Playwright e2e suite — and assets/); bun runs scripts. The split
# exists because bun has no equivalent of minimumReleaseAge.
packages:
  - assets

# Supply-chain guard (minutes): never resolve a version published
# less than 24h ago — compromised releases are usually yanked well
# within that window.
minimumReleaseAge: 1440

# pnpm 12 fails an install over a build script it is not told to allow
# or deny. None of these is needed: esbuild's binary comes from a
# prebuilt optional dependency, the `prepare` script already runs
# `lefthook install`, and svelte-preprocess's only prints a reminder.
allowBuilds:
  esbuild: false
  lefthook: false
  svelte-preprocess: false

# The Clojure packs import these without declaring them, so they
# resolved only when pnpm happened to hoist a copy; an install over an
# older node_modules can leave none and break the asset build.
packageExtensions:
  "@nextjournal/lang-clojure":
    dependencies:
      "@lezer/highlight": "^1.0.0"
  "@nextjournal/lezer-clojure":
    dependencies:
      "@lezer/common": "^1.0.0"

# Keyed by name, not version, so a bump keeps the patch while it
# still applies; when it stops applying, install fails and the patch
# must be ported to the new release.
patchedDependencies:
  # With Wrap off, Split view syncs each row pair's height across its
  # two tables. Upstream does it row by row as Svelte re-renders the
  # rows, forcing a layout of both tables per row: an expand on a
  # 3000-line diff with 100 hunks ran about 200 layouts. The patch
  # batches those syncs into one pass per frame. It also registers the
  # cleanup of a second row watching an already-watched element, which
  # upstream drops.
  "@git-diff-view/svelte": patches/@git-diff-view__svelte.patch
  # GHSA-gcqx-w48m-w2h4: merge() lets a `__proto__` key set the
  # prototype of the object it returns when the target has a null
  # prototype or a null placeholder. No release fixes it. The patch
  # drops `__proto__` and `constructor` keys outright.
  deepmerge: patches/deepmerge.patch

auditConfig:
  ignoreGhsas:
    # Closed by deepmerge's patch above.
    - GHSA-gcqx-w48m-w2h4
