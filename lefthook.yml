pre-commit:
  commands:
    no-main-commits:
      run: bash scripts/no-main-commits.sh
    check:
      run: bash scripts/check.sh

pre-push:
  commands:
    mix-test:
      run: mix test
    bun-test:
      run: cd assets && bun test
    outdated:
      run: bash scripts/outdated.sh

# Auto-install meerkat whenever local `main` advances, however it
# advances. `post-merge` catches `git pull` / `git merge`;
# `post-checkout` catches `git switch main` / `git checkout main` — the
# path a GitHub `gh pr merge --squash` takes (it lands on origin/main and
# local main is brought to it by switching/resetting, never a local
# merge — which is why the old post-merge-only trigger silently missed
# every squash-merged release). The shared guard acts only on `main`,
# and install.sh skips the rebuild when the commit is unchanged, so
# firing on every checkout is cheap.
post-merge:
  commands:
    install:
      run: bash scripts/auto-install.sh

post-checkout:
  commands:
    install:
      run: bash scripts/auto-install.sh
