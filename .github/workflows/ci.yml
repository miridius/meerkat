name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # The e2e layout specs measure pixel widths in the macOS system fonts.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: beam
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: "29"
          elixir-version: "1.20"

      # meerkat's own build is left out: checkout leaves lib/ newer than a
      # restored build, and bin/meerkat-beam then recompiles on every launch.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
            !_build/*/lib/meerkat
          key: mix-${{ runner.os }}-${{ runner.arch }}-otp${{ steps.beam.outputs.otp-version }}-elixir${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            mix-${{ runner.os }}-${{ runner.arch }}-otp${{ steps.beam.outputs.otp-version }}-elixir${{ steps.beam.outputs.elixir-version }}-

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      # bin/meerkat-beam uses mapfile, which the image's bash 3.2 lacks.
      - name: Install bash
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          brew install bash
          [[ "$(bash -c 'echo "${BASH_VERSINFO[0]}"')" -ge 4 ]]

      - run: mix deps.get
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: mix compile --warnings-as-errors
      - run: mix format --check-formatted
      - run: mix test

      - working-directory: assets
        run: bun test

      # Built ahead, as bin/meerkat-beam would, so the first e2e test's wait
      # for meerkat's URL does not include a vite build.
      - name: Build assets
        working-directory: assets
        run: MIX_BUILD_PATH="$GITHUB_WORKSPACE/_build/dev" bun run build

      - run: bunx playwright install --only-shell chromium
      - run: bun run test:e2e

      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-test-results
          path: test-results/
          if-no-files-found: ignore
