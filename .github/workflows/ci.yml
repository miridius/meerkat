name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # The e2e layout specs measure pixel widths in the macOS system fonts.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Each pinned tool but pnpm is cached per pin, so once a pin is cached
      # on main no run needs its download host. Bun aside, a cache is saved
      # as soon as its tool installs and passes any check it has, even if
      # the run later fails.
      - uses: ./.github/actions/toolchain

      # meerkat's own build is left out: checkout leaves lib/ newer than a
      # restored build, and bin/meerkat-beam then recompiles on every launch.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
            !_build/*/lib/meerkat
          key: mix-${{ runner.os }}-${{ runner.arch }}-otp${{ env.ERLANG_VERSION }}-elixir${{ env.ELIXIR_VERSION }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            mix-${{ runner.os }}-${{ runner.arch }}-otp${{ env.ERLANG_VERSION }}-elixir${{ env.ELIXIR_VERSION }}-

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          cache: true

      # bin/meerkat-attach opens a named fd (`exec {fd}<`), which the
      # image's bash 3.2 lacks.
      - id: gnu-bash
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/gnu-bash
          key: gnu-bash-${{ runner.os }}-${{ runner.arch }}-${{ env.GNU_BASH_VERSION }}-${{ env.GNU_BASH_SHA256 }}

      - if: steps.gnu-bash.outputs.cache-hit != 'true'
        run: bun scripts/build-tool.ts bash ~/.local/gnu-bash

      - name: Put GNU bash on PATH
        run: |
          echo "$HOME/.local/gnu-bash/bin" >> "$GITHUB_PATH"
          "$HOME/.local/gnu-bash/bin/bash" -c '[[ "$BASH_VERSION" == "${GNU_BASH_VERSION%.*}".* ]]'

      - if: steps.gnu-bash.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/gnu-bash
          key: ${{ steps.gnu-bash.outputs.cache-primary-key }}

      # PlantUML lays diagrams out with Graphviz's dot, which the image
      # lacks.
      - id: graphviz
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/graphviz
          key: graphviz-${{ runner.os }}-${{ runner.arch }}-${{ env.GRAPHVIZ_VERSION }}-${{ env.GRAPHVIZ_SHA256 }}

      - if: steps.graphviz.outputs.cache-hit != 'true'
        run: bun scripts/build-tool.ts graphviz ~/.local/graphviz

      - name: Put Graphviz on PATH
        run: |
          echo "$HOME/.local/graphviz/bin" >> "$GITHUB_PATH"
          "$HOME/.local/graphviz/bin/dot" -V 2>&1 | grep -F "graphviz version $GRAPHVIZ_VERSION "

      - if: steps.graphviz.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/graphviz
          key: ${{ steps.graphviz.outputs.cache-primary-key }}

      # The PlantUML unit and e2e tests render with the real plantuml. The
      # zip is cached as downloaded, and checked on every run.
      - id: plantuml
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ci/plantuml.zip
          key: plantuml-${{ runner.os }}-${{ runner.arch }}-${{ env.PLANTUML_VERSION }}-${{ env.PLANTUML_SHA256 }}

      - if: steps.plantuml.outputs.cache-hit != 'true'
        run: curl -fsSL --retry 5 --retry-all-errors --create-dirs -o ~/.cache/ci/plantuml.zip "https://github.com/plantuml/plantuml/releases/download/v$PLANTUML_VERSION/native-plantuml-macos-arm64-$PLANTUML_VERSION.zip"

      - name: Install PlantUML
        run: |
          echo "$PLANTUML_SHA256  $HOME/.cache/ci/plantuml.zip" | shasum -a 256 -c
          unzip -q ~/.cache/ci/plantuml.zip -d "$RUNNER_TEMP/plantuml"
          echo "$RUNNER_TEMP/plantuml" >> "$GITHUB_PATH"

      - if: steps.plantuml.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ci/plantuml.zip
          key: ${{ steps.plantuml.outputs.cache-primary-key }}

      # Clojure hover's unit and e2e tests analyse with the real clj-kondo.
      - id: clj-kondo
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ci/clj-kondo.zip
          key: clj-kondo-${{ runner.os }}-${{ runner.arch }}-${{ env.CLJ_KONDO_VERSION }}-${{ env.CLJ_KONDO_SHA256 }}

      - if: steps.clj-kondo.outputs.cache-hit != 'true'
        run: curl -fsSL --retry 5 --retry-all-errors --create-dirs -o ~/.cache/ci/clj-kondo.zip "https://github.com/clj-kondo/clj-kondo/releases/download/v$CLJ_KONDO_VERSION/clj-kondo-$CLJ_KONDO_VERSION-macos-aarch64.zip"

      - name: Install clj-kondo
        run: |
          echo "$CLJ_KONDO_SHA256  $HOME/.cache/ci/clj-kondo.zip" | shasum -a 256 -c
          unzip -q ~/.cache/ci/clj-kondo.zip -d "$RUNNER_TEMP/clj-kondo"
          echo "$RUNNER_TEMP/clj-kondo" >> "$GITHUB_PATH"

      - if: steps.clj-kondo.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ci/clj-kondo.zip
          key: ${{ steps.clj-kondo.outputs.cache-primary-key }}

      - run: mix deps.get
      - run: bun scripts/hex-audit.ts
      - run: pnpm audit
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: mix compile --warnings-as-errors
      - run: mix format --check-formatted
      - run: mix credo --strict
      - run: bunx biome lint --error-on-warnings
      # The same runner as the pre-commit gate, so a test cannot pass there and
      # fail here only because the files share one BEAM.
      - run: bun scripts/mix-test.ts

      - working-directory: assets
        run: bun test

      - run: bun test tests/e2e/lib

      - run: bun test scripts

      # The browser is cached per Playwright version.
      - name: Read the Playwright version
        run: |
          version=$(bunx playwright --version)
          echo "PLAYWRIGHT_VERSION=${version#Version }" >> "$GITHUB_ENV"

      - id: playwright
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ env.PLAYWRIGHT_VERSION }}

      - if: steps.playwright.outputs.cache-hit != 'true'
        run: bunx playwright install --only-shell chromium

      - if: steps.playwright.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/ms-playwright
          key: ${{ steps.playwright.outputs.cache-primary-key }}

      - run: bun run test:e2e

      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-test-results
          path: test-results/
          if-no-files-found: ignore
