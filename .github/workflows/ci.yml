name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # The e2e layout specs measure pixel widths in the macOS system fonts.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Load toolchain pins
        run: grep -v '^#' .github/toolchain.env >> "$GITHUB_ENV"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .tool-versions

      - id: beam
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          version-file: .tool-versions
          version-type: strict
          install-hex: false
          install-rebar: false

      - run: bun scripts/setup-toolchain.ts

      # meerkat's own build is left out: checkout leaves lib/ newer than a
      # restored build, and bin/meerkat-beam then recompiles on every launch.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
            !_build/*/lib/meerkat
          key: mix-${{ runner.os }}-${{ runner.arch }}-otp${{ steps.beam.outputs.otp-version }}-elixir${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            mix-${{ runner.os }}-${{ runner.arch }}-otp${{ steps.beam.outputs.otp-version }}-elixir${{ steps.beam.outputs.elixir-version }}-

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true

      # bin/meerkat-attach opens a named fd (`exec {fd}<`), which the
      # image's bash 3.2 lacks. The build is cached per pin.
      - id: gnu-bash
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/gnu-bash
          key: gnu-bash-${{ runner.os }}-${{ runner.arch }}-${{ env.GNU_BASH_VERSION }}-${{ env.GNU_BASH_SHA256 }}

      - if: steps.gnu-bash.outputs.cache-hit != 'true'
        run: bun scripts/build-tool.ts bash ~/.local/gnu-bash

      - name: Put GNU bash on PATH
        run: |
          echo "$HOME/.local/gnu-bash/bin" >> "$GITHUB_PATH"
          "$HOME/.local/gnu-bash/bin/bash" -c '[[ "$BASH_VERSION" == "${GNU_BASH_VERSION%.*}".* ]]'

      # PlantUML lays diagrams out with Graphviz's dot, which the image
      # lacks. The build is cached per pin.
      - id: graphviz
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/graphviz
          key: graphviz-${{ runner.os }}-${{ runner.arch }}-${{ env.GRAPHVIZ_VERSION }}-${{ env.GRAPHVIZ_SHA256 }}

      - if: steps.graphviz.outputs.cache-hit != 'true'
        run: bun scripts/build-tool.ts graphviz ~/.local/graphviz

      - name: Put Graphviz on PATH
        run: |
          echo "$HOME/.local/graphviz/bin" >> "$GITHUB_PATH"
          "$HOME/.local/graphviz/bin/dot" -V 2>&1 | grep -F "graphviz version $GRAPHVIZ_VERSION "

      # The PlantUML unit and e2e tests render with the real plantuml.
      - name: Install PlantUML
        run: |
          curl -fsSLo plantuml.zip "https://github.com/plantuml/plantuml/releases/download/v$PLANTUML_VERSION/native-plantuml-macos-arm64-$PLANTUML_VERSION.zip"
          echo "$PLANTUML_SHA256  plantuml.zip" | shasum -a 256 -c
          unzip -q plantuml.zip -d "$RUNNER_TEMP/plantuml"
          rm plantuml.zip
          echo "$RUNNER_TEMP/plantuml" >> "$GITHUB_PATH"

      # Clojure hover's unit and e2e tests analyse with the real clj-kondo.
      - name: Install clj-kondo
        run: |
          curl -fsSLo kondo.zip "https://github.com/clj-kondo/clj-kondo/releases/download/v$CLJ_KONDO_VERSION/clj-kondo-$CLJ_KONDO_VERSION-macos-aarch64.zip"
          echo "$CLJ_KONDO_SHA256  kondo.zip" | shasum -a 256 -c
          unzip -q kondo.zip -d "$RUNNER_TEMP/clj-kondo"
          rm kondo.zip
          echo "$RUNNER_TEMP/clj-kondo" >> "$GITHUB_PATH"

      - run: mix deps.get
      - run: bun scripts/hex-audit.ts
      - run: pnpm audit
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: mix compile --warnings-as-errors
      - run: mix format --check-formatted
      - run: mix credo --strict
      - run: bunx biome lint --error-on-warnings
      # The same runner as the pre-commit gate, so a test cannot pass there and
      # fail here only because the files share one BEAM.
      - run: bash scripts/mix-test.sh

      - working-directory: assets
        run: bun test

      - run: bun test tests/e2e/lib

      - run: bunx playwright install --only-shell chromium
      - run: bun run test:e2e

      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-test-results
          path: test-results/
          if-no-files-found: ignore
